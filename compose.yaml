services:
    mysql:
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_DATABASE: '${DB_DATABASE:-kundenportal}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-secret}']
            interval: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8125}:8025'

    minio:
        image: minio/minio:latest
        command: server /data --console-address ':9001'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-kundenportal}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-secretsecret}'
        volumes:
            - 'minio-data:/data'
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            retries: 10

    minio-init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
            mc mb --ignore-existing local/customer-api
            "
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-kundenportal}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-secretsecret}'

volumes:
    mysql-data:
    minio-data:
